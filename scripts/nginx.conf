# =============================================================================
# Nginx reverse-proxy config for Nhà đất giá tốt 24h
#
# 1. Copy to Nginx sites-available:
#      sudo cp scripts/nginx.conf /etc/nginx/sites-available/nhadatgiatot24h
#
# 2. Enable it:
#      sudo ln -s /etc/nginx/sites-available/nhadatgiatot24h \
#                 /etc/nginx/sites-enabled/nhadatgiatot24h
#      sudo rm -f /etc/nginx/sites-enabled/default   # remove default site
#
# 3. Test and reload:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. (Recommended) Add SSL with Let's Encrypt — Certbot will edit this file:
#      sudo apt-get install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d nhadatgiatot24h.com -d www.nhadatgiatot24h.com
# =============================================================================

# Redirect www → non-www
server {
    listen 80;
    server_name www.yupptek.online;
    return 301 http://yupptek.online$request_uri;
}

server {
    listen 80;
    server_name nhadatgiatot24h;

    # Max upload size (must match Next.js API limits)
    client_max_body_size 20M;

    # Serve Next.js static assets directly (faster, no Node.js overhead)
    location /_next/static/ {
        alias /home/ubuntu/real-estate-app/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Serve uploaded images directly
    location /uploads/ {
        alias /home/ubuntu/real-estate-app/public/uploads/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Everything else → Next.js on port 3000
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
