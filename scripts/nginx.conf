# =============================================================================
# Nginx reverse-proxy config for Nhà đất giá tốt 24h
#
# 1. Copy to Nginx sites-available:
#      sudo cp scripts/nginx.conf /etc/nginx/sites-available/nhadatgiatot24h
#
# 2. Enable it:
#      sudo ln -s /etc/nginx/sites-available/nhadatgiatot24h /etc/nginx/sites-enabled/nhadatgiatot24h
#      sudo rm -f /etc/nginx/sites-enabled/default
#
# 3. Test and reload:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. Get SSL certificate:
#      sudo certbot --nginx -d nhadatgiatot24h.com -d www.nhadatgiatot24h.com
# =============================================================================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name nhadatgiatot24h.com www.nhadatgiatot24h.com;
    return 301 https://nhadatgiatot24h.com$request_uri;
}

# Redirect HTTPS www → non-www
server {
    listen 443 ssl;
    server_name www.nhadatgiatot24h.com;

    ssl_certificate     /etc/letsencrypt/live/nhadatgiatot24h.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhadatgiatot24h.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nhadatgiatot24h.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name nhadatgiatot24h.com;

    ssl_certificate     /etc/letsencrypt/live/nhadatgiatot24h.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhadatgiatot24h.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size (must match Next.js API limits)
    client_max_body_size 20M;

    # Serve Next.js static assets directly (faster, no Node.js overhead)
    location /_next/static/ {
        alias /home/appuser/real-estate-app/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Serve uploaded files directly
    location /uploads/ {
        alias /home/appuser/real-estate-app/public/uploads/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Everything else → Next.js on port 3000
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
