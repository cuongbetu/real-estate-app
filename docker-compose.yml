services:
  postgres:
    image: postgres:16-alpine
    container_name: real-estate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate_dev_pw
      POSTGRES_DB: realestate
    ports:
      - "5433:5432"
    volumes:
      - real_estate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  real_estate_pgdata:
